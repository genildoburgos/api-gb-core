version: '3.8'

services:
  dynamodb-local:
    container_name: dynamodb_local
    image: "amazon/dynamodb-local:latest"
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ."
    working_dir: /home/dynamodblocal
    volumes:
      - dynamodb_data:/home/dynamodblocal

volumes:
  dynamodb_data:
