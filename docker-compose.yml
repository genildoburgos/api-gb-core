version: '3.8'

services:
  api:
    image: genildodocker/api-gb-core
    restart: always
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      JWT_SECRET: ${JWT_SECRET}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal-net

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    networks:
      - internal-net
    logging:
        driver: "json-file"
        options:
          max-size: "5m"
          max-file: "3"

networks:
  internal-net:
